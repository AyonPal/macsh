name: Release

# - Push a tag like v0.1.3     -> builds DMGs and publishes a regular GitHub Release.
# - Any new commit on main     -> builds DMGs and publishes a "nightly-YYYYMMDD-<sha>"
#   (merged PRs and direct pushes alike)  pre-release (newest 10 kept, history carried forward).
# - Manual run                 -> same as a push to the selected branch.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, needed to list changes since the last release

      - name: Check tag matches app version
        if: github.ref_type == 'tag'
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/macsh/Resources/Info.plist)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Info.plist version ${version}"
            exit 1
          fi

      - name: Xcode version
        run: xcodebuild -version

      - name: Run tests
        run: swift test

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build DMGs
        run: ./scripts/build-release.sh   # also seals the apps and runs scripts/verify-dmg.sh

      - name: Disk usage after build
        if: always()
        run: df -h /

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        run: |
          prev_tag="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          ./scripts/release-body.sh "$GITHUB_REF_NAME" "$prev_tag" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag

      - name: Publish nightly pre-release
        if: github.ref_type != 'tag'
        run: ./scripts/publish-nightly.sh
